<!doctype html>
<html lang="ko" class="follow-system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>번역 서재</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/shelf.js" defer></script>
</head>
<body>
<main class="shelf-page">
  <header class="shelf-head">
    <h1>번역 서재</h1>
    <p>마법소녀 마도카☆마기카 팬픽 한국어 번역 전자책</p>
  </header>
  <ul class="book-list" id="books" aria-live="polite"></ul>
  <p class="shelf-empty" id="empty" hidden>아직 올라온 책이 없습니다.</p>
  <footer class="shelf-foot">
    각 작품의 저작권은 원작자에게 있으며, 이곳의 번역본은 비영리로 공유합니다. 무단 전재와 재배포를 삼가 주세요.<br>
    읽던 위치는 이 기기의 브라우저에만 저장됩니다.<br>
    전자책 리더: <a href="https://github.com/johnfactotum/foliate-js" rel="noopener">foliate-js</a> (MIT)
  </footer>
</main>
</body>
</html>
